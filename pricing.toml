# pool-coder pricing table — USD per 1,000,000 tokens. EDIT FREELY.
#
# Base input/output are Anthropic list prices. Cache rates use the standard
# prompt-caching multipliers: cache_write ~= 1.25x input (5-minute cache),
# cache_read ~= 0.1x input. Claude Code mixes 5m/1h caches, so the cost figure
# is an estimate, not a bill. Point the CLI at this file with `--pricing`.
#
# Two kinds of key:
#   * family keys — [default] [opus] [sonnet] [haiku] [fable] [gpt] — matched
#     through the model's family (e.g. any claude-opus-* id uses [opus]);
#   * model-id prefixes — e.g. ["gpt-5.6-sol"] — for OpenAI (Codex) model ids
#     only, matched against the id at a "-" boundary, longest first
#     ("gpt-5.6-sol-2026-09-01" -> "gpt-5.6-sol"; an unknown "gpt-5.7-sol" does
#     NOT match "gpt-5" and falls to [gpt]). A key also covers every unlisted id
#     that extends it with "-": gpt-5-nano or gpt-5-pro would take ["gpt-5"],
#     so such a variant needs a key of its own (as ["gpt-5-codex-mini"] has).
# A prefix match wins over the family key, which wins over [default]. Claude
# ids, and any model in a Claude Code session, only use the family keys. Quote
# keys that contain a dot: ["gpt-5.6-sol"]. An unquoted [gpt-5.6-sol] is a
# nested TOML table; pool-coder joins it back into the same key, so both
# spellings work.

[default]
input = 5.0
output = 25.0
cache_write = 6.25
cache_read = 0.5

[opus]      # Claude Opus 4.x  ($5 / $25)
input = 5.0
output = 25.0
cache_write = 6.25
cache_read = 0.5

[sonnet]    # Claude Sonnet 4.x  ($3 / $15)
input = 3.0
output = 15.0
cache_write = 3.75
cache_read = 0.3

[haiku]     # Claude Haiku 4.5  ($1 / $5)
input = 1.0
output = 5.0
cache_write = 1.25
cache_read = 0.1

[fable]     # Claude Fable 5 / Mythos 5  ($10 / $50)
input = 10.0
output = 50.0
cache_write = 12.5
cache_read = 1.0

# ---- OpenAI (Codex) — Standard-tier API prices, 2026-09 --------------------
